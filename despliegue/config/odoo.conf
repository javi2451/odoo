[options]
addons_path = /opt/odoo/addons
data_dir = /var/lib/odoo
admin_passwd = admin_master_super_seguro
db_host = db
db_user = odoo
db_password = odoo_super_secret_password
# Evitar cierres por memoria (importante para producción)
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
max_cron_threads = 1
workers = 0
